# 线索提取(cue_extract)的 MLLM 配置。
# API key 不在此处：只从环境变量 OPENAI_API_KEY 读取。
# 读取者：cue_extract/run_extract_sam3.py:build_client → cue_extract/mllm.MLLMClient

model: gpt-4o
base_url: https://api.openai.com/v1
decode_temperature: 0.0  # 贪心解码，可复现
max_pixels: 1003520      # 1280*28*28，本地 smart_resize 后上传（坐标一致性 + 控 token）
cache_dir: .mllm_cache   # 已付费响应的磁盘缓存（勿删）
